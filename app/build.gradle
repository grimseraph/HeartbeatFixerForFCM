plugins {
    id 'com.android.application'
}

// Optional release signing: put keystore info in <rootProject>/keystore.properties
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'io.github.grimseraph.heartbeatfixerforgcm'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.grimseraph.heartbeatfixerforgcm"
        minSdk 21
        targetSdk 34
        // versionCode must stay monotonic and never drop below the
        // previously-shipped 202600700 (old mobodev package); 202608210
        // == 2026-08-21 build #0, safely above that floor.
        versionCode 202608210
        versionName "2.0.0"
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'
}
